[project]
name = "langread"
version = "0.1.0"
description = "Chinese reading + listening app with spaced repetition (desktop, Windows/Linux)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "openai>=1.30",
    "jieba>=0.42",
    "pypinyin>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
langread = "langread.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
